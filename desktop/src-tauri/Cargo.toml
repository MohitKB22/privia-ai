[package]
name = "privia"
version = "1.0.0"
description = "PRIVIA - Private Personal AI"
authors = ["PRIVIA Contributors"]
license = "Apache-2.0"
repository = "https://github.com/privia-app/privia"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["dialog-open", "shell-open", "window-start-dragging"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
